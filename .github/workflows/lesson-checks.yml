# Published as .github/workflows/lesson-checks.yml in team-simmer/python-foundations.
# Installs uv the way students do, on Windows and macOS, and runs Lesson 9's exercises and checks end to end
# with tests/lesson-09/test_checks.py. Each run's summary shows what the terminal printed, for the recording notes.
name: Lesson checks

on:
  push:
    branches: [main]
    paths:
      - "lesson-09/**"
      - "tests/**"
      - ".github/workflows/lesson-checks.yml"
  schedule:
    # Every Monday, to notice when a new uv, Python or tldextract changes what students see
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  # The Python version the course pins, as in the checks and test_checks.py
  COURSE_PYTHON: "3.13"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv with the command from Topic 9.1
        shell: pwsh
        run: |
          $before = Get-Command uv -ErrorAction SilentlyContinue
          $installer = powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex" *>&1 | Out-String
          $notFound = try { uv --version 2>&1 | Out-String } catch { $_.Exception.Message }
          # Windows 11's Terminal opens Windows PowerShell 5.1 unless PowerShell 7 is installed, and its message differs.
          $notFound51 = powershell -NoProfile -Command "uv --version" 2>&1 | Out-String
          $fence = '```'
          @(
            "## Installing uv on Windows", "",
            "uv on the PATH before installing: $(if ($before) { $before.Source } else { 'no' })", "",
            "### The installer's output", "", "${fence}text", $installer.Trim(), $fence, "",
            "### uv --version in the same terminal, before it's reopened (PowerShell 7)", "", "${fence}text", $notFound.Trim(), $fence, "",
            "### The same in Windows PowerShell 5.1", "", "${fence}text", $notFound51.Trim(), $fence, ""
          ) -join "`n" | Tee-Object -Variable notes | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Write-Output $notes
          "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          # Topic 9.1's beats 3 and 4 show these messages on screen.
          $problems = @()
          if (-not $installer.Contains("everything's installed!")) { $problems += "The installer no longer prints: everything's installed!" }
          if (-not $installer.Contains("to your PATH, either restart your shell or run:")) { $problems += "The installer no longer prints its PATH note." }
          if (-not $notFound51.Contains("uv : The term 'uv' is not recognized as the name of a cmdlet, function, script file, or operable program.")) { $problems += "Windows PowerShell's message for uv before the terminal is reopened has changed." }
          foreach ($problem in $problems) { Write-Output "::error::On screen, Topic 9.1: $problem Update the topic file, and re-record the shot if it matters." }
          # uv --version failed on purpose above. Don't let its exit code fail the step, unless a message changed.
          $global:LASTEXITCODE = 0
          if ($problems) { exit 1 }

      - name: Run Lesson 9's exercises and checks
        shell: pwsh
        run: uv run --python ${{ env.COURSE_PYTHON }} tests/lesson-09/test_checks.py "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/lesson-09"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv with the command from Topic 9.1
        shell: bash
        run: |
          before=$(command -v uv || echo no)
          installer=$(curl -LsSf https://astral.sh/uv/install.sh | sh 2>&1)
          not_found=$(zsh -c 'uv --version' 2>&1 || true)
          {
            echo "## Installing uv on macOS"; echo
            echo "uv on the PATH before installing: $before"; echo
            echo "### The installer's output"; echo; echo '```text'; echo "$installer"; echo '```'; echo
            echo "### uv --version in the same terminal, before it's reopened"; echo; echo '```text'; echo "$not_found"; echo '```'; echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Topic 9.1's beat 3 shows this message on screen.
          if ! grep -q "everything's installed!" <<< "$installer"; then
            echo "::error::On screen, Topic 9.1: the installer no longer prints: everything's installed! Update the topic file, and re-record the shot if it matters."
            exit 1
          fi

      - name: Run Lesson 9's exercises and checks
        shell: bash
        run: uv run --python ${{ env.COURSE_PYTHON }} tests/lesson-09/test_checks.py "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/lesson-09"
